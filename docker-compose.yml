services:
  db:
    image: postgres:16-alpine
    container_name: boston_pedidos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: boston
      POSTGRES_PASSWORD: boston_dev
      POSTGRES_DB: boston_pedidos
    ports:
      - "5433:5432"
    volumes:
      - boston_pedidos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boston -d boston_pedidos"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: boston_pedidos_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@boston.com.pe
      PGADMIN_DEFAULT_PASSWORD: boston_dev
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["debug"]

volumes:
  boston_pedidos_data:
